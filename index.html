<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rosenberg File</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive case file on Julius and Ethel Rosenberg, the couple executed for Soviet espionage in 1953.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Jost:wght@500;700;800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="desk"></div>
<main id="viewport" aria-live="polite">
  <div id="world"></div>
</main>
<div id="lamp"></div>
<div id="grain"></div>

<header id="topbar" class="bar">
  <button id="openindex" class="btn" type="button" aria-haspopup="dialog">
    <svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 3h5l1.5 1.5H15V13H1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    Case index
  </button>
  <div id="casetitle" class="casetitle"></div>
  <button id="sound" class="btn" type="button" aria-pressed="true">Sound on</button>
</header>

<footer id="bottombar" class="bar">
  <button id="back" class="btn" type="button" aria-label="Previous document">◂ Back</button>
  <div id="hint" aria-live="polite"></div>
  <span class="barspacer" aria-hidden="true"></span>
</footer>
<div id="tapcue" aria-hidden="true"><span class="ring"></span><span class="ring r2"></span><span class="dot"></span><span class="lbl">tap to continue</span></div>

<div id="index" role="dialog" aria-modal="true" aria-labelledby="ixtitle" hidden>
  <div class="ixsheet">
    <button class="btn close" type="button" aria-label="Close">Close ✕</button>
    <h3 id="ixtitle">Case index</h3>
    <div id="ixsub" class="sub"></div>
    <div id="ixbody"></div>
  </div>
</div>

<script src="js/story.js"></script>
<script src="js/credits.js"></script>
<script src="js/app.js"></script>
</body>
</html>
